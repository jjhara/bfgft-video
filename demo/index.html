<style>/* The demo video of the SIPS 2026 poster (BF-GFT on the EPA network of Table 2; copied from video/src/style.css).  N the
   blue of the negative values, neu the grey of zero, land the fill of California.
   The explainer video of the SIPS 2026 poster, a vertical feed of short clips (2026-11-22).  The colours are those
   of the poster (poster_style.tex): H the red of Itsukushima (cells of the matrices, f, the progress line), B the deep
   orange of autumn leaves (bands of the opening and closing chapters), P the deep crimson (bands of the method), R the
   vermilion (emphasis in the sentences), O the bright orange (lines of the part that moves; never text, the words that
   name it are in Ot), G the light grey of oysters (diagonal cells, panels), K black.
   Roles of the type in the frame (400 x 620 units, scaled as one picture):
     band 17 W6 white | sentence 19 W4, emphasis W6 R | formula 19 | symbols 13 |
     figure headings 12.5 W6 | labels in the figures 12
   Outside the frame (pixels): the strip of the list and the speed 14 (number 13 K2), the hint 13 white on the veil, the list of the chapters 15,
   its heading 13 W6 K2, the time while seeking 12. */
:root {
  --page: #EFEDE8; --bg: #FFFFFF; --K: #231F20; --K2: #6E6963; --K3: #A8A39C; --grid: #D2CEC7;
  --H: #A22C17; --G: #DCDAD4; --B: #A14F0B; --P: #8B0021; --R: #BC3C1D; --O: #F47820; --Ot: #A14F0B;
  --onband: #FFFFFF; --track: #D2CEC7; --veil: rgba(35, 31, 32, 0.42);
  --N: #1F5F8B; --neu: #E4E1DB; --land: #F4F2EE;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0F0E0D; --bg: #1A1816; --K: #EEEAE3; --K2: #ABA59D; --K3: #6F6A64; --grid: #46413C;
    --H: #E3664C; --G: #3D3A36; --B: #E0913F; --P: #9B1531; --R: #F28E72; --O: #F7954E; --Ot: #F2A15C;
    --onband: #FFFFFF; --track: #46413C; --veil: rgba(0, 0, 0, 0.55);
    --N: #6FA8D6; --neu: #4A4540; --land: #24211F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0F0E0D; --bg: #1A1816; --K: #EEEAE3; --K2: #ABA59D; --K3: #6F6A64; --grid: #46413C;
  --H: #E3664C; --G: #3D3A36; --B: #E0913F; --P: #9B1531; --R: #F28E72; --O: #F7954E; --Ot: #F2A15C;
  --onband: #FFFFFF; --track: #46413C; --veil: rgba(0, 0, 0, 0.55);
    --N: #6FA8D6; --neu: #4A4540; --land: #24211F;
  color-scheme: dark;
}
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--page); color: var(--K); }
body {
  font-family: "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
button { font: inherit; }

/* ---- the feed: one clip per screen, a swipe moves one clip (scroll snap, one stop per swipe) */
#feed {
  position: fixed; top: 0; bottom: 0; left: 0; right: 0; margin: 0 auto;
  width: 100%; max-width: calc(100vh * 0.62); max-width: calc(100dvh * 0.62);
  overflow-y: auto; overflow-x: hidden; scroll-snap-type: y mandatory; overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch; scrollbar-width: none; background: var(--bg); outline: none;
}
#feed::-webkit-scrollbar { display: none; }
.clip {
  position: relative; height: 100%; overflow: hidden; background: var(--bg);
  scroll-snap-align: start; scroll-snap-stop: always;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; cursor: pointer;
}
.stage { position: absolute; top: 0; left: 0; overflow: hidden; }
.frame { position: absolute; left: 0; top: 0; width: 400px; height: 620px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }

/* ---- the frame (400 x 620 units) */
.band { position: absolute; left: 0; top: 0; width: 400px; height: 40px; background: var(--P); }
.bandText { position: absolute; left: 16px; top: 0; height: 40px; line-height: 40px; color: var(--onband); font-size: 17px; font-weight: 600; white-space: nowrap; }
.claimWrap { position: absolute; left: 16px; top: 50px; width: 368px; height: 86px; }
.claim { position: absolute; left: 0; top: 0; width: 368px; font-size: 19px; line-height: 28px; font-weight: 400; word-break: keep-all; overflow-wrap: anywhere; line-break: strict; }
.claim b.em, .def b.em { font-weight: 600; color: var(--R); }
.cn { display: inline-block; width: 1.08em; height: 1.08em; line-height: 1.08em; border-radius: 50%; background: currentColor; text-align: center; font-size: 0.86em; vertical-align: 0.06em; margin: 0 0.06em; }
.cn::after { content: attr(data-n); color: var(--bg); font-weight: 600; font-family: Helvetica, Arial, sans-serif; }
.bandText .cn::after { color: var(--P); }
.fig { position: absolute; left: 0; top: 140px; width: 400px; height: 380px; overflow: visible; }
.figHtml { position: absolute; left: 0; top: 140px; width: 400px; height: 380px; pointer-events: none; }
.lab { position: absolute; white-space: nowrap; font-size: 12px; line-height: 15px; }
.head { position: absolute; white-space: nowrap; font-size: 12.5px; line-height: 17px; font-weight: 600; text-align: center; }
.eqWrap { display: none; position: absolute; left: 8px; top: 448px; width: 384px; height: 64px; }
.eq { position: absolute; left: 0; top: 0; width: 384px; height: 64px; display: flex; align-items: center; justify-content: center; font-size: 19px; }
.defWrap { position: absolute; left: 16px; top: 532px; width: 368px; height: 80px; }
.def { position: absolute; left: 0; top: 0; width: 368px; font-size: 13px; line-height: 20px; word-break: keep-all; overflow-wrap: anywhere; line-break: strict; color: var(--K); }
.mi svg, .md svg { display: inline-block; overflow: visible; }
.mi { white-space: nowrap; }
.nb { white-space: nowrap; }
.md { display: inline-block; line-height: 0; }

/* ---- paused: a play mark over the figure (at the end of the last clip, a mark to play it again) */
.paused { position: absolute; left: 50%; top: 47%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--veil); display: none; pointer-events: none; }
.paused svg { position: absolute; left: 14px; top: 14px; width: 36px; height: 36px; }
.paused path { fill: #FFFFFF; }
.clip.isPaused .paused { display: block; }

/* ---- the hint on the first clip: a pill in the empty band of the first figure between its heading and the formula
   (frame y = 406), until the first move or for 7 s */
.hint { position: absolute; left: 50%; top: 65.5%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; padding: 7px 14px 8px 10px; border-radius: 18px; background: var(--veil); color: #FFFFFF; font-size: 13px; line-height: 18px; white-space: nowrap; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
.hint.show { opacity: 1; }
.hint svg { width: 16px; height: 16px; flex: 0 0 16px; fill: currentColor; }

/* ---- the strip at the bottom of the clip above the progress line: the list of the chapters (TikTok's help: "As
   you're watching a video, you may see Playlist at the bottom") and, at its right end, the playback speed (TikTok's
   long-press menu: 0.5x, 1x, 1.5x, 2x) */
.strip { position: absolute; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); height: 40px; display: flex; background: var(--G); }
.plist {
  flex: 1 1 auto; min-width: 0; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px;
  margin: 0; border: 0; box-sizing: border-box; background: transparent; color: var(--K); font-size: 14px; line-height: 40px;
  text-align: left; cursor: pointer;
}
.plist svg { flex: 0 0 18px; width: 18px; height: 18px; fill: currentColor; }
.plName { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plNo { flex: 0 0 auto; font-size: 13px; color: var(--K2); font-variant-numeric: tabular-nums; }
.spd {
  flex: 0 0 auto; min-width: 60px; height: 40px; padding: 0 16px 0 12px; margin: 0; border: 0; border-left: 1px solid var(--bg);
  box-sizing: border-box; background: transparent; color: var(--K); font-size: 14px; line-height: 40px; text-align: center;
  font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer;
}
.plist:focus-visible, .spd:focus-visible { outline: 2px solid var(--K); outline-offset: -2px; }

/* ---- the progress line of a clip: thin; while it is dragged it grows, with a knob and the time */
.bar { position: absolute; left: 0; right: 0; bottom: env(safe-area-inset-bottom, 0px); height: 26px; touch-action: none; cursor: pointer; outline: none; }
.track { position: absolute; left: 0; right: 0; bottom: 6px; height: 3px; background: var(--track); overflow: hidden; transition: height 0.12s; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--H); }
.knob { position: absolute; bottom: 1.5px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--H); display: none; }
.tip { position: absolute; bottom: 28px; transform: translateX(-50%); padding: 2px 7px; border-radius: 3px; background: var(--K); color: var(--bg); font-size: 12px; line-height: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; display: none; }
.bar.drag .track { height: 6px; }
.bar.drag .knob, .bar.drag .tip { display: block; }
.bar:focus-visible .track { outline: 2px solid var(--K); outline-offset: 2px; }

/* ---- the buttons up and down beside the feed, on a wide screen with a mouse */
#nav { position: fixed; top: 50%; left: calc(50% + min(50vw, 31vh) + 20px); left: calc(50% + min(50vw, 31dvh) + 20px); transform: translateY(-50%); display: none; flex-direction: column; gap: 14px; }
#nav button { width: 44px; height: 44px; padding: 10px; border: 1px solid var(--grid); border-radius: 50%; background: var(--bg); color: var(--K); cursor: pointer; }
#nav button svg { width: 22px; height: 22px; display: block; fill: currentColor; }
#nav button:disabled { opacity: 0.35; cursor: default; }
#nav button:focus-visible { outline: 2px solid var(--K); outline-offset: 2px; }
@media (min-width: 720px) and (hover: hover) { #nav { display: flex; } }

/* ---- the list of the chapters and the choice of the speed, opened from the strip at the bottom of a clip */
.sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; background: var(--veil); }
.sheet[hidden] { display: none; }
.sheetPanel:focus { outline: none; }
.sheetPanel { width: 100%; max-width: calc(100vh * 0.62); max-width: calc(100dvh * 0.62); max-height: 78vh; max-height: 78dvh; overflow-y: auto; box-sizing: border-box; background: var(--bg); border-radius: 12px 12px 0 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.sheetHead { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--K2); margin: 0 0 6px; }
.sheetList { list-style: none; margin: 0; padding: 0; }
.sheetList button { display: flex; align-items: baseline; gap: 12px; width: 100%; padding: 11px 2px; border: 0; border-top: 1px solid var(--grid); background: transparent; color: var(--K); font-size: 15px; line-height: 21px; text-align: left; cursor: pointer; }
.sheetList button .no { flex: 0 0 1.6em; color: var(--K2); font-variant-numeric: tabular-nums; text-align: right; }
.sheetList button[aria-current="true"] { font-weight: 600; }
.sheetList button[aria-current="true"] .no { color: var(--H); }
.sheetList button:focus-visible { outline: 2px solid var(--K); outline-offset: -2px; }
@media (prefers-reduced-motion: reduce) { .hint, .track { transition: none; } }
</style>

    CLIPS.forEach(function (c) { io.observe(c.el); });
  }
  function start() {
    var q = new URLSearchParams(location.search);
    if (q.get('theme')) document.documentElement.setAttribute('data-theme', q.get('theme'));
    readColors();
    buildClips(); buildSheets(); setSpeed(speed); CLIPS.forEach(initBar);
    layout();
    var hm = (location.hash || '').match(/^#(\d+)$/), i0 = q.get('clip') ? parseInt(q.get('clip'), 10) - 1 : hm ? parseInt(hm[1], 10) - 1 : 0;
    i0 = Math.max(0, Math.min(NC - 1, isNaN(i0) ? 0 : i0));
    var hold = !!q.get('pause');
    feed.scrollTop = CLIPS[i0].el.offsetTop;
    activate(i0, { paused: true, mark: hold });
    if (q.get('t')) { tau = Math.max(0, Math.min(CLIPS[i0].dur - 0.01, parseFloat(q.get('t')) || 0)); dirty = true; }
    initControls();
    feed.removeAttribute('aria-busy');
    feed.focus({ preventScroll: true });
    requestAnimationFrame(tick);
    if (!hold) setTimeout(function () { if (active === i0 && !playing && !ended && !dragging) play(); }, 600);
    if (i0 === 0 && !hold && !store('bfgft_demo_moved')) showHint();
  }
  // for the checks: show clip i at x seconds into it, paused
  window.__VIDEO__ = {
    clips: CLIPS.map(function (c) { return { i: c.i, key: C.chapters[c.ch].key, part: c.part, b0: c.b0, b1: c.b1, start: c.start, dur: c.dur }; }),
    beats: BEATS, total: TOTAL,
    show: function (i, x) {
      feed.scrollTop = CLIPS[i].el.offsetTop;
      activate(i, { paused: true });
      playing = false; ended = false; tau = Math.max(0, Math.min(CLIPS[i].dur - 1e-3, x)); dirty = true;
      var c = CLIPS[i]; draw(c, c.start + tau); setBar(c, tau / c.dur); dirty = false;
    },
    play: function () { play(); },
    state: function () { return { active: active, tau: tau, playing: playing, ended: ended, sheet: openSheetId, hint: hintOn, speed: speed }; }
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else window.addEventListener('load', start);
})();
