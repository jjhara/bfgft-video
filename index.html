<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BF-GFT 手法の動画</title>
<meta name="description" content="第41回信号処理シンポジウム 1-P-1-10 のポスターの手法（BF-GFT）の数理と直感を、8 ノードの例と Karate club で示す 11 本の短い動画">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>/* The explainer video of the SIPS 2026 poster, a vertical feed of short clips (2026-11-22).  The colours are those
   of the poster (poster_style.tex): H the red of Itsukushima (cells of the matrices, f, the progress line), B the deep
   orange of autumn leaves (bands of the opening and closing chapters), P the deep crimson (bands of the method), R the
   vermilion (emphasis in the sentences), O the bright orange (lines of the part that moves; never text, the words that
   name it are in Ot), G the light grey of oysters (diagonal cells, panels), K black.
   Roles of the type in the frame (400 x 620 units, scaled as one picture):
     band 17 W6 white | sentence 19 W4, emphasis W6 R | formula 19 | symbols 13 |
     figure headings 12.5 W6 | labels in the figures 12
   Outside the frame (pixels): the strip of the list and the speed 14 (number 13 K2), the hint 13 white on the veil, the list of the chapters 15,
   its heading 13 W6 K2, the time while seeking 12. */
:root {
  --page: #EFEDE8; --bg: #FFFFFF; --K: #231F20; --K2: #6E6963; --K3: #A8A39C; --grid: #D2CEC7;
  --H: #A22C17; --G: #DCDAD4; --B: #A14F0B; --P: #8B0021; --R: #BC3C1D; --O: #F47820; --Ot: #A14F0B;
  --onband: #FFFFFF; --track: #D2CEC7; --veil: rgba(35, 31, 32, 0.42);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0F0E0D; --bg: #1A1816; --K: #EEEAE3; --K2: #ABA59D; --K3: #6F6A64; --grid: #46413C;
    --H: #E3664C; --G: #3D3A36; --B: #E0913F; --P: #9B1531; --R: #F28E72; --O: #F7954E; --Ot: #F2A15C;
    --onband: #FFFFFF; --track: #46413C; --veil: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0F0E0D; --bg: #1A1816; --K: #EEEAE3; --K2: #ABA59D; --K3: #6F6A64; --grid: #46413C;
  --H: #E3664C; --G: #3D3A36; --B: #E0913F; --P: #9B1531; --R: #F28E72; --O: #F7954E; --Ot: #F2A15C;
  --onband: #FFFFFF; --track: #46413C; --veil: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--page); color: var(--K); }
body {
  font-family: "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
button { font: inherit; }

/* ---- the feed: one clip per screen, a swipe moves one clip (scroll snap, one stop per swipe) */
#feed {
  position: fixed; top: 0; bottom: 0; left: 0; right: 0; margin: 0 auto;
  width: 100%; max-width: calc(100vh * 0.62); max-width: calc(100dvh * 0.62);
  overflow-y: auto; overflow-x: hidden; scroll-snap-type: y mandatory; overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch; scrollbar-width: none; background: var(--bg); outline: none;
}
#feed::-webkit-scrollbar { display: none; }
.clip {
  position: relative; height: 100%; overflow: hidden; background: var(--bg);
  scroll-snap-align: start; scroll-snap-stop: always;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; cursor: pointer;
}
.stage { position: absolute; top: 0; left: 0; overflow: hidden; }
.frame { position: absolute; left: 0; top: 0; width: 400px; height: 620px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }

/* ---- the frame (400 x 620 units) */
.band { position: absolute; left: 0; top: 0; width: 400px; height: 40px; background: var(--P); }
.bandText { position: absolute; left: 16px; top: 0; height: 40px; line-height: 40px; color: var(--onband); font-size: 17px; font-weight: 600; white-space: nowrap; }
.claimWrap { position: absolute; left: 16px; top: 50px; width: 368px; height: 86px; }
.claim { position: absolute; left: 0; top: 0; width: 368px; font-size: 19px; line-height: 28px; font-weight: 400; word-break: keep-all; overflow-wrap: anywhere; line-break: strict; }
.claim b.em, .def b.em { font-weight: 600; color: var(--R); }
.cn { display: inline-block; width: 1.08em; height: 1.08em; line-height: 1.08em; border-radius: 50%; background: currentColor; text-align: center; font-size: 0.86em; vertical-align: 0.06em; margin: 0 0.06em; }
.cn::after { content: attr(data-n); color: var(--bg); font-weight: 600; font-family: Helvetica, Arial, sans-serif; }
.bandText .cn::after { color: var(--P); }
.fig { position: absolute; left: 0; top: 140px; width: 400px; height: 300px; overflow: visible; }
.figHtml { position: absolute; left: 0; top: 140px; width: 400px; height: 300px; pointer-events: none; }
.lab { position: absolute; white-space: nowrap; font-size: 12px; line-height: 15px; }
.head { position: absolute; white-space: nowrap; font-size: 12.5px; line-height: 17px; font-weight: 600; text-align: center; }
.eqWrap { position: absolute; left: 8px; top: 448px; width: 384px; height: 64px; }
.eq { position: absolute; left: 0; top: 0; width: 384px; height: 64px; display: flex; align-items: center; justify-content: center; font-size: 19px; }
.defWrap { position: absolute; left: 16px; top: 520px; width: 368px; height: 92px; }
.def { position: absolute; left: 0; top: 0; width: 368px; font-size: 13px; line-height: 20px; word-break: keep-all; overflow-wrap: anywhere; line-break: strict; color: var(--K); }
.mi svg, .md svg { display: inline-block; overflow: visible; }
.mi { white-space: nowrap; }
.nb { white-space: nowrap; }
.md { display: inline-block; line-height: 0; }

/* ---- paused: a play mark over the figure (at the end of the last clip, a mark to play it again) */
.paused { position: absolute; left: 50%; top: 47%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--veil); display: none; pointer-events: none; }
.paused svg { position: absolute; left: 14px; top: 14px; width: 36px; height: 36px; }
.paused path { fill: #FFFFFF; }
.clip.isPaused .paused { display: block; }

/* ---- the hint on the first clip: a pill in the empty band of the first figure between its heading and the formula
   (frame y = 406), until the first move or for 7 s */
.hint { position: absolute; left: 50%; top: 65.5%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; padding: 7px 14px 8px 10px; border-radius: 18px; background: var(--veil); color: #FFFFFF; font-size: 13px; line-height: 18px; white-space: nowrap; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
.hint.show { opacity: 1; }
.hint svg { width: 16px; height: 16px; flex: 0 0 16px; fill: currentColor; }

/* ---- the strip at the bottom of the clip above the progress line: the list of the chapters (TikTok's help: "As
   you're watching a video, you may see Playlist at the bottom") and, at its right end, the playback speed (TikTok's
   long-press menu: 0.5x, 1x, 1.5x, 2x) */
.strip { position: absolute; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); height: 40px; display: flex; background: var(--G); }
.plist {
  flex: 1 1 auto; min-width: 0; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px;
  margin: 0; border: 0; box-sizing: border-box; background: transparent; color: var(--K); font-size: 14px; line-height: 40px;
  text-align: left; cursor: pointer;
}
.plist svg { flex: 0 0 18px; width: 18px; height: 18px; fill: currentColor; }
.plName { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plNo { flex: 0 0 auto; font-size: 13px; color: var(--K2); font-variant-numeric: tabular-nums; }
.spd {
  flex: 0 0 auto; min-width: 60px; height: 40px; padding: 0 16px 0 12px; margin: 0; border: 0; border-left: 1px solid var(--bg);
  box-sizing: border-box; background: transparent; color: var(--K); font-size: 14px; line-height: 40px; text-align: center;
  font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer;
}
.plist:focus-visible, .spd:focus-visible { outline: 2px solid var(--K); outline-offset: -2px; }

/* ---- the progress line of a clip: thin; while it is dragged it grows, with a knob and the time */
.bar { position: absolute; left: 0; right: 0; bottom: env(safe-area-inset-bottom, 0px); height: 26px; touch-action: none; cursor: pointer; outline: none; }
.track { position: absolute; left: 0; right: 0; bottom: 6px; height: 3px; background: var(--track); overflow: hidden; transition: height 0.12s; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--H); }
.knob { position: absolute; bottom: 1.5px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--H); display: none; }
.tip { position: absolute; bottom: 28px; transform: translateX(-50%); padding: 2px 7px; border-radius: 3px; background: var(--K); color: var(--bg); font-size: 12px; line-height: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; display: none; }
.bar.drag .track { height: 6px; }
.bar.drag .knob, .bar.drag .tip { display: block; }
.bar:focus-visible .track { outline: 2px solid var(--K); outline-offset: 2px; }

/* ---- the buttons up and down beside the feed, on a wide screen with a mouse */
#nav { position: fixed; top: 50%; left: calc(50% + min(50vw, 31vh) + 20px); left: calc(50% + min(50vw, 31dvh) + 20px); transform: translateY(-50%); display: none; flex-direction: column; gap: 14px; }
#nav button { width: 44px; height: 44px; padding: 10px; border: 1px solid var(--grid); border-radius: 50%; background: var(--bg); color: var(--K); cursor: pointer; }
#nav button svg { width: 22px; height: 22px; display: block; fill: currentColor; }
#nav button:disabled { opacity: 0.35; cursor: default; }
#nav button:focus-visible { outline: 2px solid var(--K); outline-offset: 2px; }
@media (min-width: 720px) and (hover: hover) { #nav { display: flex; } }

/* ---- the list of the chapters and the choice of the speed, opened from the strip at the bottom of a clip */
.sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; background: var(--veil); }
.sheet[hidden] { display: none; }
.sheetPanel:focus { outline: none; }
.sheetPanel { width: 100%; max-width: calc(100vh * 0.62); max-width: calc(100dvh * 0.62); max-height: 78vh; max-height: 78dvh; overflow-y: auto; box-sizing: border-box; background: var(--bg); border-radius: 12px 12px 0 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.sheetHead { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--K2); margin: 0 0 6px; }
.sheetList { list-style: none; margin: 0; padding: 0; }
.sheetList button { display: flex; align-items: baseline; gap: 12px; width: 100%; padding: 11px 2px; border: 0; border-top: 1px solid var(--grid); background: transparent; color: var(--K); font-size: 15px; line-height: 21px; text-align: left; cursor: pointer; }
.sheetList button .no { flex: 0 0 1.6em; color: var(--K2); font-variant-numeric: tabular-nums; text-align: right; }
.sheetList button[aria-current="true"] { font-weight: 600; }
.sheetList button[aria-current="true"] .no { color: var(--H); }
.sheetList button:focus-visible { outline: 2px solid var(--K); outline-offset: -2px; }
@media (prefers-reduced-motion: reduce) { .hint, .track { transition: none; } }
</style>
</head>
<body>
<main id="feed" role="feed" aria-label="BF-GFT の手法の動画" aria-busy="true" tabindex="-1"></main>
<nav id="nav" aria-label="クリップの移動">
  <button id="navUp" type="button" aria-label="前のクリップ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.6 15.4 12 9l6.4 6.4-1.6 1.6L12 12.2 7.2 17z"/></svg></button>
  <button id="navDown" type="button" aria-label="次のクリップ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.6 8.6 12 15l6.4-6.4L16.8 7 12 11.8 7.2 7z"/></svg></button>
</nav>
<div id="sheet" class="sheet" hidden>
  <div id="sheetPanel" class="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="sheetHead" tabindex="-1">
    <div id="sheetHead" class="sheetHead">章の一覧</div>
    <ol id="sheetList" class="sheetList"></ol>
  </div>
</div>
<div id="spdSheet" class="sheet" hidden>
  <div id="spdPanel" class="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="spdHead" tabindex="-1">
    <div id="spdHead" class="sheetHead">再生速度</div>
    <ul id="spdList" class="sheetList"></ul>
  </div>
</div>
<template id="clipTpl">
  <article class="clip">

      <div class="frame">
        <div class="band"><div class="bandText"></div></div>
        <div class="claimWrap"><div class="claim l0"></div><div class="claim l1"></div></div>

      <div class="hint" aria-hidden="true"></div>
    </div>
    <div class="strip">
      <button class="plist" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h2v2H4zM8 6h12v2H8zM4 11h2v2H4zM8 11h12v2H8zM4 16h2v2H4zM8 16h12v2H8z"/></svg><span class="plName">章の一覧</span><span class="plNo"></span></button>
      <button class="spd" type="button"></button>
    </div>
    <div class="bar" role="slider" aria-label="再生位置" tabindex="-1"><div class="track"><div class="fill"></div></div><div class="knob"></div><div class="tip"></div></div>
  </article>
</template>

<script>/* The player of the explainer video of the SIPS 2026 poster: a vertical feed of short clips (2026-11-22).
   Every clip is one frame of 400 x 620 units, scaled to the width of the screen.  Time t runs over the beats of all
   the chapters (0 to TOTAL seconds) and a clip shows the run of beats from its start to its end; draw(clip, t) sets
   every element of the frame of the clip from t alone, so seeking, pausing and playing show the same picture at the
   same time.  Every number drawn comes from window.__DATA__ (payload.json). */
(function () {
  'use strict';
  var C = window.__CONTENT__, D = window.__DATA__, MATH = window.__MATH__;
  var NS = 'http://www.w3.org/2000/svg';
  var FW = 400, FH = 620, FADE = 0.45;
  function $(id) { return document.getElementById(id); }

  // ---------------------------------------------------------------- the timeline
  function plainLen(s) { return s.replace(/\$[^$]*\$/g, 'xxx').replace(/[|*]/g, '').length; }
  function autoDur(s) { return Math.max(5.5, Math.min(10, 2.4 + 0.15 * plainLen(s))); }
  var BEATS = [], TOTAL = 0;
  C.chapters.forEach(function (ch, ci) {
    ch.start = TOTAL;
    var eq = '', def = '';
    ch.beats.forEach(function (b, bi) {
      if (b.eq !== undefined) eq = b.eq;
      if (b.def !== undefined) def = b.def;
      var d = b.dur || autoDur(b.claim || '');
      BEATS.push({ ch: ci, bi: bi, start: TOTAL, dur: d, claim: b.claim || '', eq: eq, def: def });
      TOTAL += d;
    });
    ch.end = TOTAL;
  });
  // a counter per field that changes when the text of the field changes; the two layers alternate on it
  ['claim', 'eq', 'def'].forEach(function (f) {
    var k = 0;
    BEATS.forEach(function (b, i) {
      if (i > 0 && b[f] !== BEATS[i - 1][f]) k += 1;
      b[f + 'K'] = k;
    });
  });
  function beatAt(t) {
    for (var i = BEATS.length - 1; i >= 0; i--) if (t >= BEATS[i].start) return i;
    return 0;
  }

  // ---------------------------------------------------------------- text with formulas
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function mathHtml(key, display) {
    var m = MATH[key];
    if (!m) return esc(key);
    var s = m.svg.replace('<svg', '<svg style="width:' + m.w.toFixed(3) + 'em;height:' + (m.a + m.d).toFixed(3) +
      'em;vertical-align:' + (-m.d).toFixed(3) + 'em"');
    return '<span class="' + (display ? 'md' : 'mi') + '" role="img" aria-label="' +

        if (tau >= c.dur) { tau = c.dur; playing = false; ended = true; onEnd(); }
        dirty = true;
      } else lastTs = null;
      if (dirty) {
        draw(c, c.start + Math.min(tau, c.dur - 1e-6));
        setBar(c, tau / c.dur);
        c.tip.textContent = fmtT(tau) + ' / ' + fmtT(c.dur);
        c.bar.setAttribute('aria-valuenow', Math.round(tau));
        dirty = false;
      }
    }
    requestAnimationFrame(tick);
  }

  // ---------------------------------------------------------------- the hint, the list, the controls
  var hintOn = false, hintTimer = 0;
  function showHint() {
    var touch = window.matchMedia && window.matchMedia('(hover: none)').matches;
    var h = CLIPS[0].el.querySelector('.hint');
    h.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + CHEVRON_UP + '"/></svg>' + (touch ? '上にスワイプで次へ' : '↓ キーかスクロールで次へ');
    h.classList.add('show'); hintOn = true;
    hintTimer = setTimeout(function () { hideHint(false); }, 7000);
  }
  function hideHint(moved) {
    if (moved) store('bfgft_video_moved', '1');
    if (!hintOn) return;
    clearTimeout(hintTimer);
    CLIPS[0].el.querySelector('.hint').classList.remove('show'); hintOn = false;
  }
  // the two sheets: the list of the chapters and the choice of the speed (TikTok's 0.5x, 1x, 1.5x, 2x).  A sheet holds
  // the clip while it is open.  The speed is kept for every clip and remembered by this browser.
  var SPEEDS = [0.5, 1, 1.5, 2], speed = 1;
  (function () { var v = parseFloat(store('bfgft_video_speed')); if (SPEEDS.indexOf(v) >= 0) speed = v; })();
  function spdText(v) { return String(v) + '×'; }
  function spdName(v) { return v === 1 ? '標準' : v + ' 倍速'; }
  var openSheetId = null, sheetWasPlaying = false, sheetByPointer = false, sheetOpener = null;
  function anySheet() { return openSheetId !== null; }
  function buildSheets() {
    var ol = $('sheetList');
    CLIPS.forEach(function (c) {
      var li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button'; b.dataset.i = c.i;
      b.innerHTML = '<span class="no">' + (c.i + 1) + '</span><span class="tt">' + rich(c.band.text + (c.part > 0 ? '（続き）' : '')) + '</span>';
      b.addEventListener('click', function () {
        hideSheet();
        feed.focus({ preventScroll: true });
        if (c.i === active) { ended = true; play(); } else goTo(c.i, false);
      });
      li.appendChild(b); ol.appendChild(li);
    });
    var ul = $('spdList');
    SPEEDS.forEach(function (v) {
      var li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button'; b.dataset.v = String(v);
      b.innerHTML = '<span class="tt">' + spdName(v) + '</span>';
      b.addEventListener('click', function () { setSpeed(v); closeSheet(); });
      li.appendChild(b); ul.appendChild(li);
    });
    ['sheet', 'spdSheet'].forEach(function (id) { $(id).addEventListener('click', function (e) { if (e.target === $(id)) closeSheet(); }); });
  }
  function setSpeed(v) {
    speed = v;
    store('bfgft_video_speed', String(v));
    CLIPS.forEach(function (c) {
      var b = c.el.querySelector('.spd');
      b.textContent = spdText(v);
      b.setAttribute('aria-label', '再生速度（いまは' + (v === 1 ? '標準' : ' ' + v + ' 倍速') + '）');
    });
    [].forEach.call($('spdList').querySelectorAll('button'), function (b) { b.setAttribute('aria-current', +b.dataset.v === v ? 'true' : 'false'); });
  }
  function updateSheet() {
    [].forEach.call($('sheetList').querySelectorAll('button'), function (b) { b.setAttribute('aria-current', +b.dataset.i === active ? 'true' : 'false'); });
  }
  function openSheet(id, byPointer, opener) {
    if (anySheet()) return;
    openSheetId = id; sheetByPointer = !!byPointer; sheetOpener = opener || null;
    sheetWasPlaying = playing && !ended;
    playing = false; lastTs = null;
    updateSheet();
    $(id).hidden = false;
    var list = $(id === 'sheet' ? 'sheetList' : 'spdList'), panel = $(id === 'sheet' ? 'sheetPanel' : 'spdPanel');
    var cur = list.querySelector('[aria-current="true"]');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
    // from the keyboard the focus goes to the current item; from a tap, to the panel (no ring on an item)
    if (cur && !sheetByPointer) cur.focus({ preventScroll: true }); else panel.focus({ preventScroll: true });
  }
  function hideSheet() { if (!anySheet()) return; $(openSheetId).hidden = true; openSheetId = null; }
  function closeSheet() {
    if (!anySheet()) return;
    hideSheet();
    if (sheetWasPlaying) play();
    if (sheetByPointer || !sheetOpener) feed.focus({ preventScroll: true }); else sheetOpener.focus({ preventScroll: true });
  }
  function initBar(c) {
    var bar = c.bar;
    bar.setAttribute('aria-valuemin', 0); bar.setAttribute('aria-valuemax', Math.round(c.dur));
    function at(e) { var r = bar.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * c.dur; }
    var wasPlaying = false;
    bar.addEventListener('pointerdown', function (e) {
      if (c.i !== active) return;
      e.preventDefault(); e.stopPropagation();
      clearTimeout(advanceTimer);
      dragging = true; wasPlaying = playing || ended; playing = false; ended = false;
      bar.classList.add('drag');
      try { bar.setPointerCapture(e.pointerId); } catch (x) { /* nothing */ }
      tau = Math.min(at(e), c.dur); setMark(c, false); dirty = true;
    });
    bar.addEventListener('pointermove', function (e) { if (dragging && c.i === active) { tau = Math.min(at(e), c.dur); dirty = true; } });
    function up() {
      if (!dragging) return;
      dragging = false; bar.classList.remove('drag');
      if (wasPlaying) play(); else pause();
    }
    bar.addEventListener('pointerup', up);
    bar.addEventListener('pointercancel', up);
    bar.addEventListener('click', function (e) { e.stopPropagation(); });
  }
  function initControls() {
    feed.addEventListener('click', function (e) {
      if (e.target.closest('.plist')) { e.stopPropagation(); openSheet('sheet', e.detail > 0, e.target.closest('.plist')); return; }
      if (e.target.closest('.spd')) { e.stopPropagation(); openSheet('spdSheet', e.detail > 0, e.target.closest('.spd')); return; }
      if (e.target.closest('.bar')) return;
      var sec = e.target.closest('.clip');
      if (!sec || +sec.dataset.i !== active) return;
      toggle();
    });
    // a wheel or a trackpad moves one clip per gesture (as the up and down arrows of TikTok's web site do): the
    // feed is locked while the events of one gesture keep coming (its inertia), and a new gesture may move again
    var wheelLock = 0, wheelAcc = 0, wheelQuiet = 0;
    feed.addEventListener('wheel', function (e) {
      if (e.ctrlKey || anySheet()) return;
      e.preventDefault();
      var now = performance.now(), dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? feed.clientHeight : 1);
      clearTimeout(wheelQuiet); wheelQuiet = setTimeout(function () { wheelAcc = 0; }, 200);
      if (now < wheelLock) { wheelLock = Math.max(wheelLock, now + 220); return; }
      wheelAcc += dy;
      if (Math.abs(wheelAcc) >= 30) { goTo(active + (wheelAcc > 0 ? 1 : -1), true); wheelAcc = 0; wheelLock = now + 650; }
    }, { passive: false });
    // a button pressed with the mouse gives the focus back to the feed, so that the space key keeps pausing the clip;
    // a button pressed from the keyboard keeps the focus (e.detail is 0 for a click from the keyboard)
    function back(e) { if (e.detail > 0) feed.focus({ preventScroll: true }); }
    $('navUp').addEventListener('click', function (e) { goTo(active - 1, true); back(e); });
    $('navDown').addEventListener('click', function (e) { goTo(active + 1, true); back(e); });
    document.addEventListener('keydown', function (e) {
      if (anySheet()) { if (e.key === 'Escape') { e.preventDefault(); closeSheet(); } return; }
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); goTo(active + 1, true); }
      else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); goTo(active - 1, true); }
      else if (e.key === ' ' || e.key === 'Spacebar') { if (e.target.closest && e.target.closest('button')) return; e.preventDefault(); toggle(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); seekBy(5); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); seekBy(-5); }
      else if (e.key === 'Home') { e.preventDefault(); goTo(0, false); }
      else if (e.key === 'End') { e.preventDefault(); goTo(NC - 1, false); }
    });
    var hiddenPlaying = false;
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { hiddenPlaying = playing; if (playing) { playing = false; lastTs = null; } }
      else if (hiddenPlaying) play();
    });
    window.addEventListener('resize', layout);
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq && mq.addEventListener) mq.addEventListener('change', function () {
      readColors();
      CLIPS.forEach(function (c) { if (c.F) { c.F.ch = -1; c.F.t = -1; } });
      [active - 1, active + 1].forEach(ensure); dirty = true;
    });
    // the clip that fills most of the screen is the one that plays
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting && en.intersectionRatio >= 0.6) activate(+en.target.dataset.i); });
    }, { root: feed, threshold: [0.6] });
    CLIPS.forEach(function (c) { io.observe(c.el); });
  }
  function start() {
    var q = new URLSearchParams(location.search);
    if (q.get('theme')) document.documentElement.setAttribute('data-theme', q.get('theme'));
    readColors();
    buildClips(); buildSheets(); setSpeed(speed); CLIPS.forEach(initBar);
    layout();
    var hm = (location.hash || '').match(/^#(\d+)$/), i0 = q.get('clip') ? parseInt(q.get('clip'), 10) - 1 : hm ? parseInt(hm[1], 10) - 1 : 0;
    i0 = Math.max(0, Math.min(NC - 1, isNaN(i0) ? 0 : i0));
    var hold = !!q.get('pause');
    feed.scrollTop = CLIPS[i0].el.offsetTop;
    activate(i0, { paused: true, mark: hold });
    if (q.get('t')) { tau = Math.max(0, Math.min(CLIPS[i0].dur - 0.01, parseFloat(q.get('t')) || 0)); dirty = true; }
    initControls();
    feed.removeAttribute('aria-busy');
    feed.focus({ preventScroll: true });
    requestAnimationFrame(tick);
    if (!hold) setTimeout(function () { if (active === i0 && !playing && !ended && !dragging) play(); }, 600);
    if (i0 === 0 && !hold && !store('bfgft_video_moved')) showHint();
  }
  // for the checks: show clip i at x seconds into it, paused
  window.__VIDEO__ = {
    clips: CLIPS.map(function (c) { return { i: c.i, key: C.chapters[c.ch].key, part: c.part, b0: c.b0, b1: c.b1, start: c.start, dur: c.dur }; }),
    beats: BEATS, total: TOTAL,
    show: function (i, x) {
      feed.scrollTop = CLIPS[i].el.offsetTop;
      activate(i, { paused: true });
      playing = false; ended = false; tau = Math.max(0, Math.min(CLIPS[i].dur - 1e-3, x)); dirty = true;
      var c = CLIPS[i]; draw(c, c.start + tau); setBar(c, tau / c.dur); dirty = false;
    },
    play: function () { play(); },
    state: function () { return { active: active, tau: tau, playing: playing, ended: ended, sheet: openSheetId, hint: hintOn, speed: speed }; }
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else window.addEventListener('load', start);
})();
</script>
</body>
